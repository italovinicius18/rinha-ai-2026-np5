name: rinha-2026-italo-np5

# Variant np5 v4: UDS (Unix Domain Sockets) HAProxy → API, plain NPROBE=5.
# Isolates the UDS effect against canonical baseline (+4995 plain or +5071 adaptive).
# HAProxy connects to /sockets/api{1,2}.sock instead of api{1,2}:8080 TCP loopback.
# Reduces per-connection syscall overhead by 5-20µs.
# Image: italovinicius18/rinha-2026-api:v3-uds (supports unix:/path in LISTEN_ADDR).
# Total budget: haproxy 0.15 + data-prep 0.05 + 2×api 0.40 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v1
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v3-uds
    environment:
      LISTEN_ADDR: "unix:/sockets/api1.sock"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
      - sockets:/sockets
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v3-uds
    environment:
      LISTEN_ADDR: "unix:/sockets/api2.sock"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
      - sockets:/sockets
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sockets:/sockets
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
  sockets:

name: rinha-2026-italo-np5

# Variant np5 v6: PQ-rerank (PQ filter + F32 rerank), NPROBE=12, RERANK_N=200.
# Index: ~189MB (FormatIVF_PQ_F32) = 21MB PQ codes + 168MB F32 vecs, MAP_SHARED.
# PQ filter ranks all candidates by approx distance (M=7 sub-spaces × K=256 codes,
# 8× less mem bandwidth than F32 scan); F32 rerank confirms top-5 with exact dist.
# Local WSL: +5690 p99 1.35ms, 0 FP + 1 FN — same accuracy as Adaptive 5→10 baseline.
# Hypothesis: Mac Mini DDR3 memory bandwidth is the bottleneck; PQ's 8x bandwidth
# reduction could cut p99 from 5ms → 2-3ms = +200-500 pts.
# Total budget: haproxy 0.15 + data-prep 0.05 + 2×api 0.40 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v5-pq-rerank
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v5-pq-rerank
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "12"
      RERANK_N: "200"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v5-pq-rerank
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "12"
      RERANK_N: "200"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:

name: rinha-2026-italo-np5

# Variant np5 v2: NPROBE=5 + HAProxy 0.20 / api 0.375 each.
# Hypothesis: HAProxy 0.15 is the FLOOR (#4218/#4219 with 0.10 regressed badly),
# but maybe 0.20 wrings out residual queueing at the LB. We lose 0.025 per API
# replica in exchange.
# Total budget: haproxy 0.20 + data-prep 0.05 + 2×api 0.375 = 1.00 CPU / 350 MB.

services:
  data-prep:
    image: italovinicius18/rinha-2026-data-prep:v1
    volumes:
      - index-data:/shared
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "25MB"

  api1:
    image: italovinicius18/rinha-2026-api:v1
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.375"
          memory: "155MB"

  api2:
    image: italovinicius18/rinha-2026-api:v1
    environment:
      LISTEN_ADDR: ":8080"
      INDEX_PATH: "/data/index.bin"
      NPROBE: "5"
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - index-data:/data:ro
    depends_on:
      data-prep:
        condition: service_completed_successfully
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.375"
          memory: "155MB"

  haproxy:
    image: haproxy:2.9-alpine
    depends_on: [api1, api2]
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    networks: [rinha]
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "15MB"

networks:
  rinha:
    driver: bridge

volumes:
  index-data:
